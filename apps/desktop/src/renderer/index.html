<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cash & Carry Desktop POS - Offline Terminal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 32px;
      border-radius: 20px;
      text-align: center;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 { margin-top: 0; font-size: 24px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
    .status-pill {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-pill">● Offline POS Engine Active</div>
    <h1>Cash & Carry Desktop POS</h1>
    <p>The local SQLite database and offline transaction queue are ready. You can scan barcodes and perform sales even without internet connectivity.</p>
    <button class="btn" onclick="window.location.href='http://localhost:3000/pos'">Open POS Billing Screen</button>
  </div>
</body>
</html>
